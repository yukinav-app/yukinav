<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>YukiNav</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E2792B">
<meta name="description" content="スキー・スノボのゲレンデ選びを3問で診断するアプリ">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YukiNav">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF1F4;
  --surface:#FFFFFF;
  --surface-2:#F7F9FB;
  --text:#1C2430;
  --text-muted:#5B6672;
  --border:#D7DEE5;
  --accent:#E2792B;
  --accent-ink:#7A3C10;
  --accent-soft:#FBE4CC;
  --good:#2F8F5B;
  --good-soft:#DCF0E6;
  --cold:#2E6B8A;
  --cold-soft:#DCEAF1;
  --font-display:'Oswald',sans-serif;
  --font-body:'Work Sans',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121820; --surface:#1B232D; --surface-2:#212B36; --text:#EDEFF2; --text-muted:#9AA7B4;
    --border:#2C3844; --accent:#F0924A; --accent-ink:#2A1204; --accent-soft:#3A2412;
    --good:#4FBF86; --good-soft:#1C3A2B; --cold:#5FA8CC; --cold-soft:#1C3340;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121820; --surface:#1B232D; --surface-2:#212B36; --text:#EDEFF2; --text-muted:#9AA7B4;
  --border:#2C3844; --accent:#F0924A; --accent-ink:#2A1204; --accent-soft:#3A2412;
  --good:#4FBF86; --good-soft:#1C3A2B; --cold:#5FA8CC; --cold-soft:#1C3340;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;}
.num{font-variant-numeric:tabular-nums;}
.ic-svg{display:inline-block;vertical-align:-4px;flex:0 0 auto;}
button{font-family:inherit;}
a{color:inherit;}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border);}
.header-inner{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap;}
.brand{display:flex;align-items:baseline;gap:10px;flex:1 1 auto;min-width:0;}
.brand h1{font-size:22px;font-weight:700;letter-spacing:0.5px;color:var(--text);}
.brand .tagline{font-size:12.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.beta-pill{font-size:10.5px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:3px 9px;flex:0 0 auto;}
.lang-toggle{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;flex:0 0 auto;}
.lang-toggle button{border:none;background:var(--surface);color:var(--text-muted);font-size:12.5px;font-weight:600;padding:7px 14px;cursor:pointer;}
.lang-toggle button.active{background:var(--accent);color:#fff;}

/* bottom tab bar (native-app style) */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--surface);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.bottom-nav-inner{
  max-width:1080px;margin:0 auto;display:flex;
}
.nav-btn{
  flex:1 1 0;border:none;background:transparent;color:var(--text-muted);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 4px 10px;cursor:pointer;font-size:10.5px;font-weight:600;
}
.nav-btn .nav-ic{display:flex;line-height:1;}
.nav-btn .nav-ic .ic-svg{vertical-align:0;}
.nav-btn.active{color:var(--accent);}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));}

.search-row{padding-block:14px 14px;display:flex;gap:10px;flex-wrap:wrap;}
.search-box{flex:1 1 220px;position:relative;}
.search-box input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:14px;}
.search-box input:focus{outline:2px solid var(--accent);outline-offset:1px;}
select{padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13.5px;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);font-size:13px;font-weight:500;cursor:pointer;user-select:none;white-space:nowrap;}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);}
.chip input{display:none;}

main{padding-block:18px 24px;}
.view-title{font-size:20px;margin-bottom:4px;}
.view-sub{color:var(--text-muted);font-size:13px;margin-bottom:16px;}
.result-count{color:var(--text-muted);font-size:13px;margin-bottom:12px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;font-family:inherit;color:inherit;}
.card:hover{border-color:var(--accent);}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.card h3{font-size:18px;line-height:1.25;}
.region-tag{font-size:11px;color:var(--text-muted);margin-top:2px;}
.weather-chip{flex:0 0 auto;display:flex;align-items:center;gap:4px;font-size:12.5px;background:var(--cold-soft);color:var(--cold);border-radius:999px;padding:4px 9px;}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--text-muted);}
.meta-row .dot{opacity:0.6;}
.price-row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;}
.price{font-family:var(--font-display);font-size:17px;}
.price .unit{font-family:var(--font-body);font-size:11.5px;color:var(--text-muted);font-weight:500;}
.badge{font-size:11px;font-weight:600;border-radius:7px;padding:3px 7px;}
.badge.student{background:var(--good-soft);color:var(--good);}

/* wizard */
.wizard-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:18px;}
.wizard-intro{color:var(--text-muted);font-size:13.5px;margin-bottom:18px;}
.q-block{margin-bottom:20px;}
.q-label{font-size:14.5px;font-weight:600;margin-bottom:10px;}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;}
.pill{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:500;cursor:pointer;}
.pill.sel{background:var(--accent);border-color:var(--accent);color:#fff;}
.wizard-submit{width:100%;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:700;border-radius:12px;padding:14px;cursor:pointer;margin-top:4px;}
.wizard-submit:disabled{opacity:0.4;cursor:not-allowed;}

.reco-card{background:var(--surface);border:2px solid var(--accent);border-radius:18px;padding:22px;margin-bottom:16px;}
.reco-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-soft);display:inline-block;border-radius:999px;padding:4px 11px;margin-bottom:10px;}
.reco-card h2{font-size:26px;margin-bottom:4px;}
.reco-sub{color:var(--text-muted);font-size:13px;margin-bottom:16px;}
.reco-approx-note{background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:9px 12px;font-size:12px;margin-bottom:14px;}
.reco-rows{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.reco-row{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:11px 13px;}
.reco-row .ic{font-size:18px;flex:0 0 auto;}
.reco-row .rt{font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:2px;}
.reco-row .rv{font-size:13.5px;}
.packing-list{display:flex;flex-wrap:wrap;gap:6px;}
.packing-item{background:var(--cold-soft);color:var(--cold);border-radius:999px;padding:4px 10px;font-size:12px;}
.reco-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
.reco-secondary-btn{flex:1 1 auto;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:10px;padding:11px;font-size:13.5px;font-weight:600;cursor:pointer;}
.reco-detail-btn{flex:1 1 auto;border:none;background:var(--accent);color:#fff;border-radius:10px;padding:11px;font-size:13.5px;font-weight:600;cursor:pointer;}

/* weather tab */
.weather-grid{display:flex;flex-direction:column;gap:10px;}
.weather-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;font-family:inherit;color:inherit;width:100%;}
.weather-card:hover{border-color:var(--accent);}
.weather-ic{font-size:28px;flex:0 0 auto;width:40px;text-align:center;}
.weather-main{flex:1;min-width:0;}
.weather-main h3{font-size:16px;}
.live-badge{font-size:9.5px;font-weight:700;letter-spacing:0.05em;color:var(--good);background:var(--good-soft);border-radius:999px;padding:2px 6px;vertical-align:middle;}
.weather-main .wsub{font-size:12px;color:var(--text-muted);margin-top:2px;}
.weather-temp{font-family:var(--font-display);font-size:22px;flex:0 0 auto;text-align:right;}
.weather-temp .wd{font-family:var(--font-body);font-size:11px;color:var(--text-muted);font-weight:500;}

/* map tab */
.map-wrap{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:320/560;background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;}
.map-svg{position:absolute;inset:0;width:100%;height:100%;}
.map-svg ellipse,.map-svg circle{fill:var(--surface-2);stroke:var(--border);stroke-width:1.5;}
.map-svg line{stroke:var(--border);stroke-width:1.2;}
.map-pins{position:absolute;inset:0;}
.map-pin{
  position:absolute;transform:translate(-50%,-100%);border:none;background:transparent;cursor:pointer;
  padding:0;line-height:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.25));
}
.map-pin .pin-dot{
  width:16px;height:16px;border-radius:50% 50% 50% 0;background:var(--accent);transform:rotate(45deg);
  display:block;border:2px solid var(--surface);
}
.map-pin.sel .pin-dot{background:#D93025;}
.map-legend{text-align:center;font-size:11.5px;color:var(--text-muted);margin-top:10px;}
.map-active-card{margin-top:16px;}

/* gear tab */
.gear-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.gear-tab-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.gear-tab-btn.sel{background:var(--accent);border-color:var(--accent);color:#fff;}
.gear-tab-btn .dot-missing{width:6px;height:6px;border-radius:50%;background:var(--text-muted);opacity:0.5;}
.gear-product-card{background:var(--surface);border:2px solid var(--accent);border-radius:18px;padding:24px;text-align:center;}
.gear-product-ic{font-size:44px;margin-bottom:10px;}
.gear-product-name{font-size:18px;font-weight:700;margin-bottom:6px;}
.gear-product-tag{font-size:11.5px;font-weight:600;color:var(--good);background:var(--good-soft);border-radius:999px;padding:3px 10px;display:inline-block;margin-bottom:14px;}
.gear-product-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;text-decoration:none;font-size:14px;font-weight:700;border-radius:10px;padding:12px 20px;}
.gear-empty-card{background:var(--surface-2);border:1px dashed var(--border);border-radius:18px;padding:28px;text-align:center;color:var(--text-muted);font-size:13.5px;}

/* detail overlay */
.overlay{position:fixed;inset:0;background:rgba(10,14,18,0.5);display:flex;justify-content:center;align-items:flex-end;z-index:50;padding-top:env(safe-area-inset-top,0px);}
.overlay[hidden]{display:none;}
.sheet{width:100%;max-width:720px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:22px 22px calc(28px + env(safe-area-inset-bottom,0px));}
@media (min-width:760px){.overlay{align-items:center;padding-top:0;} .sheet{border-radius:18px;max-height:88vh;margin-block:20px;}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px;}
.sheet-head h2{font-size:26px;}
.close-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--text-muted);border-radius:10px;width:34px;height:34px;font-size:16px;cursor:pointer;flex:0 0 auto;}
.sheet-sub{color:var(--text-muted);font-size:13px;margin-bottom:18px;}
.section-label{font-size:11.5px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;}
.info-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px;}
.info-card{background:var(--surface-2);border-radius:12px;padding:12px;}
.info-card .big{font-family:var(--font-display);font-size:19px;}
.info-card .label{font-size:11.5px;color:var(--text-muted);margin-top:3px;}
.terrain-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;margin-bottom:8px;}
.terrain-legend{display:flex;gap:14px;font-size:12px;color:var(--text-muted);flex-wrap:wrap;margin-bottom:20px;}
.terrain-legend span{display:inline-flex;align-items:center;gap:5px;}
.swatch{width:9px;height:9px;border-radius:3px;display:inline-block;}
.cta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:20px;}
.cta-card{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:8px;}
.cta-card .cta-title{font-size:13.5px;font-weight:600;}
.cta-card .cta-desc{font-size:12px;color:var(--text-muted);flex:1;}
.cta-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;background:var(--accent);color:#fff;text-decoration:none;font-size:12.5px;font-weight:600;border-radius:8px;padding:8px 10px;}
.cta-btn:hover{opacity:0.9;}
.disclaimer{font-size:11.5px;color:var(--text-muted);border-top:1px solid var(--border);padding-top:14px;margin-top:6px;}
.empty{padding-block:40px;text-align:center;color:var(--text-muted);}
</style>
</head>
<body>

<header>
  <div class="wrap header-inner">
    <div class="brand">
      <h1>YukiNav</h1>
      <span class="tagline" data-t="tagline"></span>
    </div>
    <span class="beta-pill" data-t="betaPill"></span>
    <div class="lang-toggle" role="group" aria-label="language">
      <button id="btnJa" class="active">日本語</button>
      <button id="btnEn">EN</button>
    </div>
  </div>
  <div class="wrap search-row" id="searchRow" hidden>
    <div class="search-box">
      <input id="searchInput" type="search" data-t-placeholder="searchPlaceholder">
    </div>
    <select id="regionSelect"></select>
    <label class="chip" id="chipStudent"><input type="checkbox"><svg class="ic-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-4 10 4-10 4z"/><path d="M6 11v4c0 1.5 2.7 3 6 3s6-1.5 6-3v-4"/></svg> <span data-t="chipStudent"></span></label>
    <label class="chip" id="chipEnglish"><input type="checkbox"><svg class="ic-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg> <span data-t="chipEnglish"></span></label>
  </div>
</header>

<main>
  <div class="wrap">

    <div id="wizardView">
      <div class="wizard-card" id="wizardQuiz">
        <div class="wizard-intro" data-t="wizardIntro"></div>
        <div class="q-block">
          <div class="q-label" data-t="qFromBlock"></div>
          <div class="pill-row" id="pillBlock"></div>
        </div>
        <div class="q-block" id="prefBlockWrap" hidden>
          <div class="q-label" data-t="qFromPref"></div>
          <div class="pill-row" id="pillPref"></div>
        </div>
        <div class="q-block">
          <div class="q-label" data-t="qTrip"></div>
          <div class="pill-row" id="pillTrip"></div>
        </div>
        <div class="q-block">
          <div class="q-label" data-t="qLevel"></div>
          <div class="pill-row" id="pillLevel"></div>
        </div>
        <button class="wizard-submit" id="wizardSubmit" disabled data-t="wizardSubmit"></button>
      </div>
      <div id="wizardResult" hidden></div>
    </div>

    <div id="nearbyView" hidden>
      <div class="result-count" id="resultCount"></div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="emptyState" hidden></div>
    </div>

    <div id="weatherView" hidden>
      <h2 class="view-title" data-t="weatherTitle"></h2>
      <div class="view-sub" data-t="weatherSub"></div>
      <div class="weather-grid" id="weatherGrid"></div>
      <div class="disclaimer" data-t="disclaimer" style="margin-top:16px"></div>
    </div>

    <div id="mapView" hidden>
      <h2 class="view-title" data-t="mapTitle"></h2>
      <div class="view-sub" data-t="mapSub"></div>
      <div class="map-wrap">
        <svg class="map-svg" viewBox="0 0 320 560" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <ellipse cx="200" cy="55" rx="58" ry="42" transform="rotate(-10 200 55)"/>
          <ellipse cx="208" cy="135" rx="30" ry="50" transform="rotate(-8 208 135)"/>
          <ellipse cx="192" cy="228" rx="42" ry="48" transform="rotate(-5 192 228)"/>
          <ellipse cx="155" cy="315" rx="58" ry="32" transform="rotate(5 155 315)"/>
          <ellipse cx="143" cy="372" rx="24" ry="14"/>
          <ellipse cx="100" cy="402" rx="34" ry="44" transform="rotate(5 100 402)"/>
          <circle cx="60" cy="520" r="7"/>
          <line x1="90" y1="460" x2="65" y2="513" stroke-dasharray="3 3"/>
        </svg>
        <div class="map-pins" id="mapPins"></div>
      </div>
      <div class="map-legend" id="mapLegend"></div>
    </div>

    <div id="gearView" hidden>
      <h2 class="view-title" data-t="gearTitle2"></h2>
      <div class="view-sub" data-t="gearSub"></div>
      <div class="gear-tabs" id="gearTabs"></div>
      <div id="gearContent"></div>
    </div>

  </div>
</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <button class="nav-btn active" id="navWizard"><span class="nav-ic" id="icWizard"></span><span data-t="tabWizard"></span></button>
    <button class="nav-btn" id="navNearby"><span class="nav-ic" id="icNearby"></span><span data-t="tabNearby"></span></button>
    <button class="nav-btn" id="navWeather"><span class="nav-ic" id="icWeather"></span><span data-t="tabWeather"></span></button>
    <button class="nav-btn" id="navMap"><span class="nav-ic" id="icMap"></span><span data-t="tabMap"></span></button>
    <button class="nav-btn" id="navGear"><span class="nav-ic" id="icGear"></span><span data-t="tabGear"></span></button>
  </div>
</nav>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

function buildPills(container, items, groupKey, labelFn){
  const el = document.getElementById(container);
  el.innerHTML = items.map((item,i)=>`<button type="button" class="pill" data-group="${groupKey}" data-idx="${i}">${labelFn(item,i)}</button>`).join("");
  el.querySelectorAll(".pill").forEach(btn=>{
    btn.addEventListener("click",()=>{
      el.querySelectorAll(".pill").forEach(b=>b.classList.remove("sel"));
      btn.classList.add("sel");
      wiz[groupKey] = Number(btn.dataset.idx);
      updateSubmitState();
    });
  });
}

function buildBlockPills(){
  const el = document.getElementById("pillBlock");
  el.innerHTML = REGION_BLOCKS.map(b=>{
    const label = state.lang==="ja" ? b.ja : b.en;
    const sel = wiz.block===b.id ? "sel" : "";
    return `<button type="button" class="pill ${sel}" data-block="${b.id}">${label}</button>`;
  }).join("");
  el.querySelectorAll(".pill").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      wiz.block = btn.dataset.block;
      wiz.prefIdx = null;
      el.querySelectorAll(".pill").forEach(b=>b.classList.remove("sel"));
      btn.classList.add("sel");
      document.getElementById("prefBlockWrap").hidden = false;
      buildPrefPills();
      updateSubmitState();
    });
  });
}

function buildPrefPills(){
  if(!wiz.block) return;
  const el = document.getElementById("pillPref");

    const sel = wiz.prefIdx===i ? "sel" : "";

function matches(r){
  const q = state.query.trim().toLowerCase();
  const name = (state.lang==="ja" ? r.nameJa+r.prefJa : r.nameEn+" "+r.prefEn).toLowerCase();
  if(q && !name.includes(q)) return false;
  if(state.region!=="all" && r.region!==state.region) return false;
  if(state.studentOnly && !r.liftStudent) return false;
  if(state.englishOnly && r.english==="low") return false;
  return true;
}

function wmoToCondition(code){
  if([71,73,75,77,85,86].includes(code)) return {ja:"雪", en:"Snow"};
  if(code===0) return {ja:"快晴", en:"Clear"};
  if([1,2].includes(code)) return {ja:"晴れ", en:"Sunny"};
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return {ja:"雨", en:"Rain"};
  if([95,96,99].includes(code)) return {ja:"雷雨", en:"Thunderstorm"};
  return {ja:"曇り", en:"Cloudy"};
}

async function fetchLiveWeather(r){
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${r.lat}&longitude=${r.lng}&current=temperature_2m,weather_code,wind_speed_10m,snow_depth&timezone=Asia%2FTokyo`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("weather http " + res.status);
    const data = await res.json();
    const cond = wmoToCondition(data.current.weather_code);
    r.weather = {
      tempC: Math.round(data.current.temperature_2m),
      condJa: cond.ja,
      condEn: cond.en,
      wind: Math.round(data.current.wind_speed_10m),
      depth: Math.round((data.current.snow_depth || 0) * 100),
    };
    r.liveWeather = true;
  }catch(err){
    console.warn("live weather fetch failed for", r.id, err);
  }
}

async function loadAllLiveWeather(){
  await Promise.all(RESORTS.filter(r=>r.lat).map(fetchLiveWeather));
  render();
}

function weatherIcon(condJa){
  if(condJa.includes("雪")||condJa.includes("Snow")||condJa.includes("パウダー")||condJa.includes("Powder")) return icon("snow",18);
  if(condJa.includes("雨")||condJa.includes("Rain")||condJa.includes("雷")||condJa.includes("Thunderstorm")) return icon("cloud",18);
  if(condJa.includes("曇")||condJa.includes("Cloud")) return icon("cloud",18);
  return icon("sun",18);
}

    const name = state.lang==="ja" ? r.nameJa : r.nameEn;

    const time = state.lang==="ja" ? r.timeJa : r.timeEn;
    return `
    <button class="card" data-id="${r.id}">
      <div class="card-top">
        <div><h3>${name}</h3><div class="region-tag">${pref}</div></div>
        <div class="weather-chip">${weatherIcon(r.weather.condJa)} <span class="num">${r.weather.tempC}°C</span></div>
      </div>
      <div class="meta-row">
        <span>${t("nearestFrom")}: ${city} <span class="num">${r.distKm}km</span></span>
        <span class="dot">・</span><span>${time}</span>
      </div>
      <div class="price-row">
        <div class="price">¥<span class="num">${r.liftAdult.toLocaleString()}</span> <span class="unit">${t("priceUnit")}</span></div>
        ${r.liftStudent ? `<span class="badge student">${t("studentBadge")}</span>` : ""}
      </div>
    </button>`;
  }).join("");
}

function renderWeatherTab(){
  const list = RESORTS.slice().sort((a,b)=>a.distKm-b.distKm);
  const grid = document.getElementById("weatherGrid");
  grid.innerHTML = list.map(r=>{
    const name = state.lang==="ja" ? r.nameJa : r.nameEn;
    const pref = state.lang==="ja" ? r.prefJa : r.prefEn;
    const cond = state.lang==="ja" ? r.weather.condJa : r.weather.condEn;
    return `
    <button class="weather-card" data-id="${r.id}">
      <div class="weather-ic">${weatherIcon(r.weather.condJa)}</div>
      <div class="weather-main">
        <h3>${name} ${r.liveWeather ? `<span class="live-badge">${t("liveWeatherBadge")}</span>` : ""}</h3>
        <div class="wsub">${pref} ・ ${cond} ・ ${t("depthLabel")} <span class="num">${r.weather.depth}cm</span> ・ ${t("windLabel")} <span class="num">${r.weather.wind}km/h</span></div>
      </div>
      <div class="weather-temp"><span class="num">${r.weather.tempC}°</span><div class="wd">C</div></div>
    </button>`;
  }).join("");
  grid.querySelectorAll(".weather-card").forEach(btn=>{
    btn.addEventListener("click", ()=>openDetail(btn.dataset.id));
  });
}

function renderMapTab(){
  const pins = document.getElementById("mapPins");
  pins.innerHTML = RESORTS.filter(r=>MAP_PINS[r.id]).map(r=>{
    const p = MAP_PINS[r.id];
    const name = state.lang==="ja" ? r.nameJa : r.nameEn;
    return `<button class="map-pin" style="left:${(p.x/320*100).toFixed(1)}%;top:${(p.y/560*100).toFixed(1)}%" data-id="${r.id}" aria-label="${name}" title="${name}"><span class="pin-dot"></span></button>`;
  }).join("");
  pins.querySelectorAll(".map-pin").forEach(btn=>{
    btn.addEventListener("click", ()=>openDetail(btn.dataset.id));
  });
  document.getElementById("mapLegend").textContent = t("mapLegend");
}

const gearState = {selected: GEAR_CATEGORIES[0].id};

function renderGearTab(){
  const tabs = document.getElementById("gearTabs");
  tabs.innerHTML = GEAR_CATEGORIES.map(g=>{
    const label = state.lang==="ja" ? g.ja : g.en;
    const sel = g.id===gearState.selected ? "sel" : "";
    const dot = g.real ? "" : `<span class="dot-missing" title="${state.lang==="ja"?"準備中":"coming soon"}"></span>`;
    return `<button type="button" class="gear-tab-btn ${sel}" data-id="${g.id}">${icon(g.ic,16)} ${label} ${dot}</button>`;
  }).join("");
  tabs.querySelectorAll(".gear-tab-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{ gearState.selected = btn.dataset.id; renderGearTab(); });
  });

  const g = GEAR_CATEGORIES.find(x=>x.id===gearState.selected);
  const content = document.getElementById("gearContent");
  if(g.real){
    const name = state.lang==="ja" ? g.productJa : g.productEn;
    content.innerHTML = `
      <div class="gear-product-card">
        <div class="gear-product-ic">${icon(g.ic,40)}</div>
        <div class="gear-product-tag">${state.lang==="ja"?"実在のアフィリエイト商品":"Live affiliate product"}</div>
        <div class="gear-product-name">${name}</div>
        <a class="gear-product-btn" href="${g.url}" target="_blank" rel="noopener">${state.lang==="ja"?"楽天市場で見る":"View on Rakuten"}</a>
      </div>`;
  } else {
    content.innerHTML = `
      <div class="gear-empty-card">${state.lang==="ja"?"このカテゴリはまだアフィリエイトリンク未登録です。楽天で商品ページを開いて「リンクを作成」→共有してもらえれば、ここに反映します。":"No affiliate link registered for this category yet. Generate one on Rakuten and share it to get it added here."}</div>`;
  }
}

function openDetail(id){
  const r = RESORTS.find(x=>x.id===id);
  if(!r) return;
  const name = state.lang==="ja" ? r.nameJa : r.nameEn;
  const pref = state.lang==="ja" ? r.prefJa : r.prefEn;
  const city = state.lang==="ja" ? r.cityJa : r.cityEn;
  const time = state.lang==="ja" ? r.timeJa : r.timeEn;
  const desc = state.lang==="ja" ? r.descJa : r.descEn;
  const cond = state.lang==="ja" ? r.weather.condJa : r.weather.condEn;
  const englishText = r.english==="high" ? t("englishHigh") : r.english==="medium" ? t("englishMedium") : t("englishLow");
  const terrainLabels = [t("terrainBeginner"), t("terrainIntermediate"), t("terrainAdvanced")];
  const lodgingQuery = encodeURIComponent((state.lang==="ja"?r.nameJa:r.nameEn) + " " + (state.lang==="ja"?"周辺 宿泊":"area hotels"));
  const foodQuery = encodeURIComponent((state.lang==="ja"?r.nameJa:r.nameEn) + " " + (state.lang==="ja"?"周辺 レストラン":"area restaurants"));
  const gearQuery = encodeURIComponent((state.lang==="ja"?r.nameJa:r.nameEn) + " " + (state.lang==="ja"?"スキー グッズ":"ski gear"));
  const onsenQuery = encodeURIComponent((state.lang==="ja"?r.nameJa:r.nameEn) + " " + (state.lang==="ja"?"周辺 日帰り温泉":"area day-trip onsen"));
  const placeQuery = encodeURIComponent(state.lang==="ja"?r.nameJa:r.nameEn);

  const sheet = document.getElementById("sheet");
  sheet.innerHTML = `
    <div class="sheet-head">
      <div>
        <h2>${name}</h2>
        <div class="sheet-sub">${pref} ・ ${t("nearestFrom")}: ${city} <span class="num">${r.distKm}km</span> ・ ${time}${r.flight?`<br>${t("flightNote")}`:""}</div>
      </div>
      <button class="close-btn" id="closeBtn" aria-label="${t('close')}">✕</button>
    </div>
    <p>${desc}</p>
    <div class="info-cards">
      <div class="info-card"><div class="big num">${r.base}–${r.top}m</div><div class="label">${state.lang==="ja"?"標高（麓〜山頂）":"Elevation (base–top)"}</div></div>
      <div class="info-card"><div class="big">${weatherIcon(r.weather.condJa)} <span class="num">${r.weather.tempC}°C</span></div><div class="label">${cond} ・ ${t("windLabel")} <span class="num">${r.weather.wind}km/h</span></div></div>
      <div class="info-card"><div class="big num">${r.weather.depth}cm</div><div class="label">${t("depthLabel")}</div></div>
      <div class="info-card"><div class="big num">¥${r.liftAdult.toLocaleString()} / ${r.liftStudent?"¥"+r.liftStudent.toLocaleString():t("noStudentDiscount")}</div><div class="label">${t("liftLabel")}</div></div>
    </div>
    <div class="section-label">${t("terrainLabel")}</div>
    <div class="terrain-bar">${r.terrain.map((p,i)=>`<div style="width:${p}%;background:${terrainColors[i]}"></div>`).join("")}</div>
    <div class="terrain-legend">${r.terrain.map((p,i)=>`<span><span class="swatch" style="background:${terrainColors[i]}"></span>${terrainLabels[i]} <span class="num">${p}%</span></span>`).join("")}</div>
    <div class="section-label">${t("englishLabel")}</div>
    <p style="margin-top:0;margin-bottom:20px;font-size:13.5px;color:var(--text-muted);">${englishText}</p>
    <div class="section-label">${state.lang==="ja"?"周辺サービスへ送客":"Connect to nearby services"}</div>
    <div class="cta-grid">
      <div class="cta-card"><div class="cta-title">${icon("pin",16)} ${t("placeTitle")}</div><div class="cta-desc">${t("placeDesc")}</div><a class="cta-btn" href="https://www.google.com/maps/search/?api=1&query=${placeQuery}" target="_blank" rel="noopener">${t("placeBtn")}</a></div>
      <div class="cta-card"><div class="cta-title">${icon("hotel",16)} ${t("lodgingTitle")}</div><div class="cta-desc">${t("lodgingDesc")}</div><a class="cta-btn" href="https://travel.rakuten.co.jp/dosearch/?f_keyword=${lodgingQuery}" target="_blank" rel="noopener">${t("lodgingBtn")}</a></div>
      <div class="cta-card"><div class="cta-title">${icon("food",16)} ${t("foodTitle")}</div><div class="cta-desc">${t("foodDesc")}</div><a class="cta-btn" href="https://www.google.com/maps/search/${foodQuery}" target="_blank" rel="noopener">${t("foodBtn")}</a></div>
      <div class="cta-card"><div class="cta-title">${icon("ski",16)} ${t("gearTitle")}</div><div class="cta-desc">${t("gearDesc")}</div><a class="cta-btn" href="https://search.rakuten.co.jp/search/mall/${gearQuery}/" target="_blank" rel="noopener">${t("gearBtn")}</a></div>
      <div class="cta-card"><div class="cta-title">${icon("onsen",16)} ${t("onsenTitle")}</div><div class="cta-desc">${t("onsenDesc")}</div><a class="cta-btn" href="https://www.google.com/maps/search/${onsenQuery}" target="_blank" rel="noopener">${t("onsenBtn")}</a></div>
    </div>
    <div class="disclaimer">${t("disclaimer")}</div>
  `;
  document.getElementById("overlay").hidden = false;
  document.getElementById("closeBtn").addEventListener("click", closeDetail);
  sheet.scrollTop = 0;
}
function closeDetail(){ document.getElementById("overlay").hidden = true; }

function packingList(r){
  const items = [t("packBase"), t("packBase2"), t("packBase3"), t("packBase4")];
  if(r.weather.tempC <= -5){ items.push(t("packCold")); items.push(t("packCold2")); }
  if(r.weather.condJa.includes("雪") || r.weather.condJa.includes("パウダー")){ items.push(t("packSnow")); }
  return items;
}

function scoreResort(r, fromCityJa, levelIdx){
  let score = 0;
  if(r.cityJa === fromCityJa) score += 100;
  score -= r.distKm * 0.2;
  score += r.terrain[levelIdx] * 0.6;
  return score;
}

function computeRanking(){
  const pref = PREFECTURES[wiz.prefIdx];
  return RESORTS.map(r=>({r, s:scoreResort(r, pref.anchorJa, wiz.level)})).sort((a,b)=>b.s-a.s).map(x=>x.r);
}

function renderRecommendation(){
  const pref = PREFECTURES[wiz.prefIdx];
  const ranked = computeRanking();
  const notYetShown = ranked.find(r=>!wiz.shown.includes(r.id)) || ranked[0];
  wiz.lastId = notYetShown.id;
  wiz.shown.push(notYetShown.id);
  if(wiz.shown.length > RESORTS.length) wiz.shown = [notYetShown.id];

  const r = notYetShown;
  const name = state.lang==="ja" ? r.nameJa : r.nameEn;
  const city = state.lang==="ja" ? r.cityJa : r.cityEn;
  const prefName = state.lang==="ja" ? pref.ja : pref.en;
  const anchorName = state.lang==="ja" ? pref.anchorJa : pref.anchorEn;
  const time = state.lang==="ja" ? r.timeJa : r.timeEn;
  const cond = state.lang==="ja" ? r.weather.condJa : r.weather.condEn;
  const tripLabel = t(TRIP_OPTS[wiz.trip]);
  const levelLabel = t(LEVEL_OPTS[wiz.level]);
  const isDayTrip = wiz.trip===0;
  const longTrip = r.distKm >= 100;
  const stayVerdict = (isDayTrip && !longTrip) ? t("stayDayOk") : (longTrip ? t("stayRecommend") : t("stayDayOk"));
  const packing = packingList(r);
  const accessLine = anchorName===city
    ? `${prefName} → ${name}・${time}`
    : `${prefName}（${state.lang==="ja"?"最寄りの拠点":"nearest hub"}: ${anchorName}）→ ${name}・${time}`;

  const box = document.getElementById("wizardResult");
  box.hidden = false;
  box.innerHTML = `
    <div class="reco-card">
      <div class="reco-eyebrow">${t("recoEyebrow")}</div>
      <h2>${name}</h2>
      <div class="reco-sub">${t("recoWhy")(tripLabel, levelLabel)}</div>
      ${pref.approx ? `<div class="reco-approx-note">${t("approxNote")}</div>` : ""}
      <div class="reco-rows">
        <div class="reco-row"><div class="ic">${icon("car",20)}</div><div><div class="rt">${t("rowAccess")}</div><div class="rv">${accessLine}${r.flight?`<br><span style="font-size:11.5px;color:var(--text-muted)">${t("flightNote")}</span>`:""}</div></div></div>
        <div class="reco-row"><div class="ic">${weatherIcon(r.weather.condJa)}</div><div><div class="rt">${t("rowWeather")}</div><div class="rv"><span class="num">${r.weather.tempC}°C</span>・${cond}・${t("depthLabel")} <span class="num">${r.weather.depth}cm</span></div></div></div>
        <div class="reco-row"><div class="ic">${icon("bed",20)}</div><div><div class="rt">${t("rowStay")}</div><div class="rv">${stayVerdict}</div></div></div>
        <div class="reco-row"><div class="ic">${icon("backpack",20)}</div><div style="flex:1"><div class="rt">${t("rowPacking")}</div><div class="packing-list">${packing.map(p=>`<span class="packing-item">${p}</span>`).join("")}</div></div></div>
      </div>
      <div class="reco-actions">
        <button class="reco-secondary-btn" id="anotherBtn">${icon("refresh",15)} ${t("another")}</button>
        <button class="reco-detail-btn" id="seeDetailBtn">${t("seeDetail")}</button>
      </div>
    </div>
    <button class="reco-secondary-btn" id="startOverBtn" style="width:100%">${t("startOver")}</button>
  `;
  document.getElementById("anotherBtn").addEventListener("click", renderRecommendation);
  document.getElementById("seeDetailBtn").addEventListener("click", ()=>openDetail(r.id));
  document.getElementById("startOverBtn").addEventListener("click", resetWizard);
  document.getElementById("wizardQuiz").hidden = true;
  box.scrollIntoView({behavior:"smooth", block:"start"});
}

function resetWizard(){
  wiz.block=null; wiz.prefIdx=null; wiz.trip=null; wiz.level=null; wiz.lastId=null; wiz.shown=[];
  document.getElementById("wizardResult").hidden = true;
  document.getElementById("wizardResult").innerHTML = "";
  document.getElementById("prefBlockWrap").hidden = true;
  document.getElementById("wizardQuiz").hidden = false;
  applyStaticText();
}

function setView(view){
  state.view = view;
  document.getElementById("navWizard").classList.toggle("active", view==="wizard");
  document.getElementById("navNearby").classList.toggle("active", view==="nearby");
  document.getElementById("navWeather").classList.toggle("active", view==="weather");
  document.getElementById("navMap").classList.toggle("active", view==="map");
  document.getElementById("navGear").classList.toggle("active", view==="gear");
  document.getElementById("wizardView").hidden = view!=="wizard";
  document.getElementById("nearbyView").hidden = view!=="nearby";
  document.getElementById("weatherView").hidden = view!=="weather";
  document.getElementById("mapView").hidden = view!=="map";
  document.getElementById("gearView").hidden = view!=="gear";
  document.getElementById("searchRow").hidden = view!=="nearby";
  if(view==="nearby") renderGrid();
  if(view==="weather") renderWeatherTab();
  if(view==="map") renderMapTab();
  if(view==="gear") renderGearTab();
}

function render(){
  applyStaticText();
  if(state.view==="nearby") renderGrid();
  if(state.view==="weather") renderWeatherTab();
  if(state.view==="map") renderMapTab();
  if(state.view==="gear") renderGearTab();
  if(state.view==="wizard" && !document.getElementById("wizardResult").hidden && wiz.lastId){
    const idx = wiz.shown.indexOf(wiz.lastId);
    if(idx>-1) wiz.shown.splice(idx,1);
    renderRecommendation();
  }
}

document.getElementById("btnJa").addEventListener("click", ()=>{state.lang="ja"; render();});
document.getElementById("btnEn").addEventListener("click", ()=>{state.lang="en"; render();});
document.getElementById("navWizard").addEventListener("click", ()=>setView("wizard"));
document.getElementById("navNearby").addEventListener("click", ()=>setView("nearby"));
document.getElementById("navWeather").addEventListener("click", ()=>setView("weather"));
document.getElementById("navMap").addEventListener("click", ()=>setView("map"));
document.getElementById("navGear").addEventListener("click", ()=>setView("gear"));
document.getElementById("wizardSubmit").addEventListener("click", renderRecommendation);
document.getElementById("searchInput").addEventListener("input", (e)=>{state.query=e.target.value; renderGrid();});
document.getElementById("regionSelect").addEventListener("change", (e)=>{state.region=e.target.value; renderGrid();});
document.getElementById("chipStudent").addEventListener("click", ()=>{
  state.studentOnly = !state.studentOnly;
  document.getElementById("chipStudent").classList.toggle("on", state.studentOnly);
  renderGrid();
});
document.getElementById("chipEnglish").addEventListener("click", ()=>{
  state.englishOnly = !state.englishOnly;
  document.getElementById("chipEnglish").classList.toggle("on", state.englishOnly);
  renderGrid();
});
document.getElementById("grid").addEventListener("click", (e)=>{
  const card = e.target.closest(".card");
  if(card) openDetail(card.dataset.id);
});
document.getElementById("overlay").addEventListener("click", (e)=>{ if(e.target.id==="overlay") closeDetail(); });
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeDetail(); });

document.getElementById("icWizard").innerHTML = icon("sparkle", 20);
document.getElementById("icNearby").innerHTML = icon("pin", 20);
document.getElementById("icWeather").innerHTML = icon("sun", 20);
document.getElementById("icMap").innerHTML = icon("map", 20);
document.getElementById("icGear").innerHTML = icon("backpack", 20);

applyStaticText();
setView("wizard");
loadAllLiveWeather();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(err=>console.warn("SW registration failed", err));
  });
}
</script>

</body></html>
